name: CI
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/src/index.mjs && node --check cloudflare/src/scheduler.mjs
      - name: Build
        run: bun run build
