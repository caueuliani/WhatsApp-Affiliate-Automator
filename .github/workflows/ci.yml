name: CI
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/src/index.mjs && node --check cloudflare/src/scheduler.mjs
      - name: Build
        run: bun run build

  browser-e2e:
    name: Chromium UI E2E (isolated fixture)
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install application dependencies
        run: bun install
      - name: Install pinned Playwright separately (does not change root lockfile)
        run: npm install --prefix e2e --no-package-lock --ignore-scripts
      - name: Install headless Chromium with Linux dependencies
        run: ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Run local-browser E2E on production React components (no real APIs)
        run: ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs
      - name: Upload diagnostic screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: e2e/e2e-results/
          retention-days: 7
          if-no-files-found: ignore
